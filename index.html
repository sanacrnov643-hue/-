<html lang="ru">

<head>

<meta charset="UTF-8">

<meta

<title>Калькулятор характеристик</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 20px;
    background: #111827;
    color: #f3f4f6;
    font-family: Arial, sans-serif;
}

.container {
    max-width: 1100px;
    margin: auto;
}

h1 {
    text-align: center;
    margin-bottom: 25px;
}

h2 {
    margin-top: 30px;
}

.card {
    background: #1f2937;
    border-radius: 14px;
    padding: 20px;
    margin-bottom: 20px;
}

.stats-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 10px;
}

.stat {
    background: #111827;
    padding: 12px;
    border-radius: 10px;
}

.stat label {
    display: flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;
}

.proc-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 10px;
    overflow-x: auto;
}

.slot {
    min-width: 110px;
    background: #111827;
    padding: 10px;
    border-radius: 10px;
}

.slot-title {
    text-align: center;
    font-weight: bold;
    margin-bottom: 10px;
}

.proc-cell {
    width: 100%;
    padding: 9px;
    margin-bottom: 8px;
    border: 1px solid #374151;
    border-radius: 7px;
    background: #1f2937;
    color: white;
    text-align: center;
    font-size: 16px;
}

.proc-cell::placeholder {
    color: #9ca3af;
}

.proc-sum {
    text-align: center;
    font-size: 13px;
    margin-top: 5px;
}

.proc-sum.ok {
    color: #4ade80;
}

.proc-sum.bad {
    color: #f87171;
}

button {
    width: 100%;
    padding: 15px;
    border: none;
    border-radius: 10px;
    background: #2563eb;
    color: white;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    background: #1d4ed8;
}

button:disabled {
    background: #4b5563;
    cursor: not-allowed;
}

.progress {
    margin-top: 15px;
    text-align: center;
    color: #93c5fd;
}

.result {
    display: none;
}

.result-slot {
    margin-bottom: 15px;
    padding: 15px;
    background: #111827;
    border-radius: 10px;
}

.result-slot h3 {
    margin-top: 0;
}

.result-stat {
    display: flex;
    justify-content: space-between;
    gap: 15px;
    padding: 5px 0;
    border-bottom: 1px solid #374151;
}

.result-stat:last-child {
    border-bottom: none;
}

.total-row {
    font-weight: bold;
    font-size: 17px;
}

.unused {
    margin-top: 15px;
    padding: 15px;
    border-radius: 10px;
    background: #172554;
}

.error {
    color: #f87171;
    margin-top: 10px;
}

.success {
    color: #4ade80;
    margin-top: 10px;
}

.info {
    color: #93c5fd;
    margin-top: 10px;
}

@media (max-width: 600px) {

    body {
        padding: 10px;
    }

    .card {
        padding: 14px;
    }

    .proc-grid {
        grid-template-columns: repeat(5, 100px);
    }

    .result-stat {
        font-size: 14px;
    }

}

</style>

</head>

<script>

"use strict";


/* =========================================================
   НАСТРОЙКИ ХАРАКТЕРИСТИК
   ========================================================= */

const STAT_NAMES = {

    crit: "Шанс крита",

    penetration: "Проницание",

    accuracy: "Точность",

    critDamage: "Урон крита",

    attack: "Атака",

    meter: "Прирост шкалы",

    cooldown: "Перезарядка приёмов"

};


/* =========================================================
   ДИАПАЗОНЫ
   ========================================================= */

const RANGES = {

    crit: {
        min: 70,
        max: 90,
        target: 80
    },

    penetration: {
        min: 45,
        max: 55,
        target: 50
    },

    accuracy: {
        min: 45,
        max: 55,
        target: 50
    },

    critDamage: {
        min: 95,
        max: 120,
        target: 105
    },

    attack: {
        min: 0,
        max: 225,
        target: 0
    },

    meter: {
        min: 0,
        max: 100,
        target: 0
    },

    cooldown: {
        min: -50,
        max: 0,
        target: -30
    }

};


/* =========================================================
   БАЗОВЫЙ КРИТ
   ========================================================= */

const BASE_CRIT = 20;


/* =========================================================
   DOM
   ========================================================= */

const procCells =
    [...document.querySelectorAll(".proc-cell")];

const statChecks =
    [...document.querySelectorAll(".stat-check")];

const calculateButton =
    document.getElementById("calculateButton");

const progress =
    document.getElementById("progress");

const validationError =
    document.getElementById("validationError");

const result =
    document.getElementById("result");

const resultContent =
    document.getElementById("resultContent");

const usage =
    document.getElementById("usage");


/* =========================================================
   ПОЛУЧЕНИЕ ПРОКОВ
   ========================================================= */

function getProcs() {

    const slots = [];


    for (
        let slot = 0;
        slot < 5;
        slot++
    ) {

        const cells =
            procCells.filter(
                cell =>
                    Number(cell.dataset.slot) === slot
            );


        const values =
            cells.map(cell => {

                if (
                    cell.value.trim() === ""
                ) {

                    return 0;

                }


                let value =
                    Number(cell.value);


                if (
                    !Number.isFinite(value)
                ) {

                    value = 0;

                }


                value =
                    Math.max(
                        0,
                        Math.min(
                            14,
                            Math.floor(value)
                        )
                    );


                return value;

            });


        slots.push(values);

    }


    return slots;

}


/* =========================================================
   ВЫБРАННЫЕ ХАРАКТЕРИСТИКИ
   ========================================================= */

function getEnabledStats() {

    return statChecks
        .filter(
            check => check.checked
        )
        .map(
            check => check.value
        );

}


/* =========================================================
   ПРОВЕРКА ВХОДНЫХ ДАННЫХ
   ========================================================= */

function validate() {

    const stats =
        getEnabledStats();


    const procs =
        getProcs();


    if (
        stats.length < 3
    ) {

        return {

            valid: false,

            error:
                "Нужно выбрать минимум 3 характеристики."

        };

    }


    for (
        let i = 0;
        i < procs.length;
        i++
    ) {

        const sum =
            procs[i][0] +
            procs[i][1] +
            procs[i][2];


        if (
            sum !== 14
        ) {

            return {

                valid: false,

                error:
                    `В слоте ${i + 1} сумма проков ` +
                    `должна быть 14. Сейчас: ${sum}.`

            };

        }

    }


    return {

        valid: true,

        error: ""

    };

}


/* =========================================================
   ОБНОВЛЕНИЕ СУММ
   ========================================================= */

function updateProcSums() {

    const slots =
        document.querySelectorAll(".slot");


    slots.forEach(slot => {

        const inputs =
            [
                ...slot.querySelectorAll(
                    ".proc-cell"
                )
            ];


        const sum =
            inputs.reduce(
                (
                    total,
                    input
                ) => {

                    if (
                        input.value.trim() === ""
                    ) {

                        return total;

                    }


                    const value =
                        Number(input.value);


                    return total +
                        (
                            Number.isFinite(value)
                                ? value
                                : 0
                        );

                },
                0
            );


        const span =
            slot.querySelector(
                ".proc-sum span"
            );


        const box =
            slot.querySelector(
                ".proc-sum"
            );


        span.textContent =
            sum;


        box.classList.remove(
            "ok",
            "bad"
        );


        if (
            sum === 14
        ) {

            box.classList.add("ok");

        } else {

            box.classList.add("bad");

        }

    });

}


/* =========================================================
   ЗНАЧЕНИЕ ПРОКА
   =========================================================

   АТАКА:
   0 проков  = +6%
   1 прок    = +9%
   2 прока   = +12%
   ...
   14 проков = +48%

   Остальные положительные:
   0 проков  = +3%
   1 прок    = +6%
   2 прока   = +9%
   ...
   14 проков = +45%

   Cooldown:
   0 проков  = -3%
   1 прок    = -6%
   ...
   14 проков = -45%
   ========================================================= */

function procValue(
    stat,
    proc
) {

    /*
        ИСПРАВЛЕННАЯ АТАКА
    */

    if (
        stat === "attack"
    ) {

        return 6 + (proc * 3);

    }


    /*
        Остальные характеристики.
    */

    const value =
        3 * (proc + 1);


    /*
        Перезарядка отрицательная.
    */

    if (
        stat === "cooldown"
    ) {

        return -value;

    }


    return value;

}


/* =========================================================
   ГЕНЕРАЦИЯ РАСПРЕДЕЛЕНИЙ
   ========================================================= */

function generateAssignments(
    stats,
    procValues
) {

    const result = [];


    for (
        let a = 0;
        a < stats.length;
        a++
    ) {

        for (
            let b = 0;
            b < stats.length;
            b++
        ) {

            if (
                b === a
            ) {

                continue;

            }


            for (
                let c = 0;
                c < stats.length;
                c++
            ) {

                if (
                    c === a ||
                    c === b
                ) {

                    continue;

                }


                result.push([

                    {
                        stat: stats[a],

                        proc:
                            procValues[0],

                        value:
                            procValue(
                                stats[a],
                                procValues[0]
                            )
                    },

                    {
                        stat: stats[b],

                        proc:
                            procValues[1],

                        value:
                            procValue(
                                stats[b],
                                procValues[1]
                            )
                    },

                    {
                        stat: stats[c],

                        proc:
                            procValues[2],

                        value:
                            procValue(
                                stats[c],
                                procValues[2]
                            )
                    }

                ]);

            }

        }

    }


    const unique =
        new Map();


    for (
        const assignment of result
    ) {

        const key =
            assignment
                .map(
                    item =>
                        `${item.stat}:${item.proc}`
                )
                .join("|");


        if (
            !unique.has(key)
        ) {

            unique.set(
                key,
                assignment
            );

        }

    }


    return [
        ...unique.values()
    ];

}


/* =========================================================
   ДОБАВЛЕНИЕ РАСПРЕДЕЛЕНИЯ
   ========================================================= */

function addAssignment(
    totals,
    assignment
) {

    const result = {
        ...totals
    };


    for (
        const item of assignment
    ) {

        result[item.stat] =
            (
                result[item.stat] || 0
            ) +
            item.value;

    }


    return result;

}


/* =========================================================
   МИНИМАЛЬНОЕ И МАКСИМАЛЬНОЕ ЗНАЧЕНИЕ
   ========================================================= */

function getEffectiveRange(
    stat
) {

    const range =
        RANGES[stat];


    if (
        stat === "crit"
    ) {

        return {

            min:
                range.min -
                BASE_CRIT,

            max:
                range.max -
                BASE_CRIT

        };

    }


    return {

        min: range.min,

        max: range.max

    };

}


/* =========================================================
   ПРОВЕРКА ВОЗМОЖНОСТИ СОСТОЯНИЯ
   ========================================================= */

function stateStillPossible(
    totals,
    stats,
    slotsLeft
) {

    for (
        const stat of stats
    ) {

        const range =
            getEffectiveRange(stat);


        const current =
            totals[stat] || 0;


        const maxPossible =
            current +
            slotsLeft * 48;


        const minPossible =
            current -
            slotsLeft * 45;


        if (
            maxPossible <
            range.min
        ) {

            return false;

        }


        if (
            minPossible >
            range.max
        ) {

            return false;

        }

    }


    return true;

}


/* =========================================================
   ФИНАЛЬНАЯ ПРОВЕРКА
   ========================================================= */

function isValidFinalState(
    totals,
    stats
) {

    for (
        const stat of stats
    ) {

        const range =
            getEffectiveRange(stat);


        const value =
            totals[stat] || 0;


        if (
            stat === "crit" ||
            stat === "penetration" ||
            stat === "accuracy" ||
            stat === "critDamage"
        ) {

            if (
                value < range.min ||
                value > range.max
            ) {

                return false;

            }

        }


        if (
            stat === "attack"
        ) {

            if (
                value <
                RANGES.attack.min ||
                value >
                RANGES.attack.max
            ) {

                return false;

            }

        }


        if (
            stat === "meter"
        ) {

            if (
                value <
                RANGES.meter.min ||
                value >
                RANGES.meter.max
            ) {

                return false;

            }

        }


        if (
            stat === "cooldown"
        ) {

            if (
                value <
                RANGES.cooldown.min ||
                value >
                RANGES.cooldown.max
            ) {

                return false;

            }

        }

    }


    return true;

}


/* =========================================================
   ОЦЕНКА СОСТОЯНИЯ
   ========================================================= */

function scoreState(
    totals,
    stats
) {

    let score = 0;


    /*
        Атака
    */

    if (
        stats.includes("attack")
    ) {

        const value =
            totals.attack || 0;


        score +=
            value * 1000;

    }


    /*
        Урон крита
    */

    if (
        stats.includes("critDamage")
    ) {

        const value =
            totals.critDamage || 0;


        score +=
            value * 900;

    }


    /*
        Шанс крита
    */

    if (
        stats.includes("crit")
    ) {

        const value =
            totals.crit || 0;


        score +=
            value * 300;

    }


    /*
        Проницание
    */

    if (
        stats.includes("penetration")
    ) {

        const value =
            totals.penetration || 0;


        score +=
            value * 50;

    }


    /*
        Точность
    */

    if (
        stats.includes("accuracy")
    ) {

        const value =
            totals.accuracy || 0;


        score +=
            value * 20;

    }


    /*
        Прирост шкалы
    */

    if (
        stats.includes("meter")
    ) {

        const value =
            totals.meter || 0;


        score +=
            value * 10;

    }


    /*
        Перезарядка
    */

    if (
        stats.includes("cooldown")
    ) {

        const value =
            totals.cooldown || 0;


        score +=
            Math.abs(value) * 10;

    }


    return score;

}


/* =========================================================
   КЛЮЧ СОСТОЯНИЯ
   ========================================================= */

function makeKey(
    totals,
    stats
) {

    return stats
        .map(
            stat =>
                `${stat}:${totals[stat] || 0}`
        )
        .join("|");

}


/* =========================================================
   СЖАТИЕ СОСТОЯНИЙ
   ========================================================= */

function compressStates(
    states,
    stats
) {

    const map =
        new Map();


    for (
        const state of states
    ) {

        const key =
            makeKey(
                state.totals,
                stats
            );


        const existing =
            map.get(key);


        if (
            !existing
        ) {

            map.set(
                key,
                state
            );

            continue;

        }


        if (
            scoreState(
                state.totals,
                stats
            ) >
            scoreState(
                existing.totals,
                stats
            )
        ) {

            map.set(
                key,
                state
            );

        }

    }


    return [
        ...map.values()
    ];

}


/* =========================================================
   СОКРАЩЕНИЕ СОСТОЯНИЙ
   ========================================================= */

function pruneStates(
    states,
    stats,
    slotsLeft
) {

    const result = [];


    for (
        const state of states
    ) {

        if (
            stateStillPossible(
                state.totals,
                stats,
                slotsLeft
            )
        ) {

            result.push(state);

        }

    }


    return result;

}


/* =========================================================
   СОЗДАНИЕ WORKER
   ========================================================= */

function createWorker() {

    const workerCode = `

"use strict";


const RANGES =
    ${JSON.stringify(RANGES)};


const BASE_CRIT =
    ${BASE_CRIT};


/* =========================================================
   ЭФФЕКТИВНЫЙ ДИАПАЗОН
   ========================================================= */

function getEffectiveRange(stat) {

    const range =
        RANGES[stat];


    if (
        stat === "crit"
    ) {

        return {

            min:
                range.min -
                BASE_CRIT,

            max:
                range.max -
                BASE_CRIT

        };

    }


    return {

        min: range.min,

        max: range.max

    };

}


/* =========================================================
   ЗНАЧЕНИЕ ПРОКА
   =========================================================

   Здесь также исправлена АТАКА:

   0 проков  = +6%
   1 прок    = +9%
   ...
   14 проков = +48%
   ========================================================= */

function procValue(
    stat,
    proc
) {

    /*
        АТАКА
    */

    if (
        stat === "attack"
    ) {

        return 6 + (proc * 3);

    }


    /*
        Остальные статы
    */

    const value =
        3 * (proc + 1);


    /*
        Cooldown
    */

    if (
        stat === "cooldown"
    ) {

        return -value;

    }


    return value;

}


/* =========================================================
   ГЕНЕРАЦИЯ РАСПРЕДЕЛЕНИЙ
   ========================================================= */

function generateAssignments(
    stats,
    procValues
) {

    const result = [];


    for (
        let a = 0;
        a < stats.length;
        a++
    ) {

        for (
            let b = 0;
            b < stats.length;
            b++
        ) {

            if (
                b === a
            ) {

                continue;

            }


            for (
                let c = 0;
                c < stats.length;
                c++
            ) {

                if (
                    c === a ||
                    c === b
                ) {

                    continue;

                }


                result.push([

                    {
                        stat: stats[a],

                        proc:
                            procValues[0],

                        value:
                            procValue(
                                stats[a],
                                procValues[0]
                            )

                    },

                    {
                        stat: stats[b],

                        proc:
                            procValues[1],

                        value:
                            procValue(
                                stats[b],
                                procValues[1]
                            )

                    },

                    {
                        stat: stats[c],

                        proc:
                            procValues[2],

                        value:
                            procValue(
                                stats[c],
                                procValues[2]
                            )

                    }

                ]);

            }

        }

    }


    const unique =
        new Map();


    for (
        const assignment of result
    ) {

        const key =
            assignment
                .map(
                    item =>
                        item.stat +
                        ":" +
                        item.proc
                )
                .join("|");


        if (
            !unique.has(key)
        ) {

            unique.set(
                key,
                assignment
            );

        }

    }


    return [
        ...unique.values()
    ];

}


/* =========================================================
   ДОБАВЛЕНИЕ
   ========================================================= */

function addAssignment(
    totals,
    assignment
) {

    const result = {
        ...totals
    };


    for (
        const item of assignment
    ) {

        result[item.stat] =
            (
                result[item.stat] || 0
            ) +
            item.value;

    }


    return result;

}


/* =========================================================
   ВОЗМОЖНОСТЬ
   ========================================================= */

function stateStillPossible(
    totals,
    stats,
    slotsLeft
) {

    for (
        const stat of stats
    ) {

        const range =
            getEffectiveRange(stat);


        const current =
            totals[stat] || 0;


        /*
            Для атаки максимум одного
            оставшегося слота = 48%.

            Для остальных положительных
            характеристик максимум = 45%.
        */

        const maxPerSlot =
            stat === "attack"
                ? 48
                : 45;


        const maxPossible =
            current +
            slotsLeft * maxPerSlot;


        const minPossible =
            current -
            slotsLeft * 45;


        if (
            maxPossible <
            range.min
        ) {

            return false;

        }


        if (
            minPossible >
            range.max
        ) {

            return false;

        }

    }


    return true;

}


/* =========================================================
   ФИНАЛЬНАЯ ПРОВЕРКА
   ========================================================= */

function isValidFinalState(
    totals,
    stats
) {

    for (
        const stat of stats
    ) {

        const range =
            getEffectiveRange(stat);


        const value =
            totals[stat] || 0;


        if (
            stat === "crit" ||
            stat === "penetration" ||
            stat === "accuracy" ||
            stat === "critDamage"
        ) {

            if (
                value < range.min ||
                value > range.max
            ) {

                return false;

            }

        }


        if (
            stat === "attack"
        ) {

            if (
                value <
                RANGES.attack.min ||
                value >
                RANGES.attack.max
            ) {

                return false;

            }

        }


        if (
            stat === "meter"
        ) {

            if (
                value <
                RANGES.meter.min ||
                value >
                RANGES.meter.max
            ) {

                return false;

            }

        }


        if (
            stat === "cooldown"
        ) {

            if (
                value <
                RANGES.cooldown.min ||
                value >
                RANGES.cooldown.max
            ) {

                return false;

            }

        }

    }


    return true;

}


/* =========================================================
   ОЦЕНКА
   ========================================================= */

function scoreState(
    totals,
    stats
) {

    let score = 0;


    if (
        stats.includes("attack")
    ) {

        score +=
            (
                totals.attack || 0
            ) * 1000;

    }


    if (
        stats.includes("critDamage")
    ) {

        score +=
            (
                totals.critDamage || 0
            ) * 900;

    }


    if (
        stats.includes("crit")
    ) {

        score +=
            (
                totals.crit || 0
            ) * 300;

    }


    if (
        stats.includes("penetration")
    ) {

        score +=
            (
                totals.penetration || 0
            ) * 50;

    }


    if (
        stats.includes("accuracy")
    ) {

        score +=
            (
                totals.accuracy || 0
            ) * 20;

    }


    if (
        stats.includes("meter")
    ) {

        score +=
            (
                totals.meter || 0
            ) * 10;

    }


    if (
        stats.includes("cooldown")
    ) {

        score +=
            Math.abs(
                totals.cooldown || 0
            ) * 10;

    }


    return score;

}


/* =========================================================
   KEY
   ========================================================= */

function makeKey(
    totals,
    stats
) {

    return stats
        .map(
            stat =>
                stat +
                ":" +
                (
                    totals[stat] || 0
                )
        )
        .join("|");

}


/* =========================================================
   СЖАТИЕ
   ========================================================= */

function compressStates(
    states,
    stats
) {

    const map =
        new Map();


    for (
        const state of states
    ) {

        const key =
            makeKey(
                state.totals,
                stats
            );


        const existing =
            map.get(key);


        if (
            !existing
        ) {

            map.set(
                key,
                state
            );

            continue;

        }


        if (
            scoreState(
                state.totals,
                stats
            ) >
            scoreState(
                existing.totals,
                stats
            )
        ) {

            map.set(
                key,
                state
            );

        }

    }


    return [
        ...map.values()
    ];

}


/* =========================================================
   УДАЛЕНИЕ НЕВОЗМОЖНЫХ
   ========================================================= */

function pruneStates(
    states,
    stats,
    slotsLeft
) {

    const result = [];


    for (
        const state of states
    ) {

        if (
            stateStillPossible(
                state.totals,
                stats,
                slotsLeft
            )
        ) {

            result.push(state);

        }

    }


    return result;

}


/* =========================================================
   WORKER
   ========================================================= */

self.onmessage =
    function(event) {

    try {

        const data =
            event.data;


        const stats =
            data.stats;


        const procs =
            data.procs;


        /*
            Создаём варианты каждого слота.
        */

        const assignments =
            procs.map(
                slot =>
                    generateAssignments(
                        stats,
                        slot
                    )
            );


        /*
            Начальное состояние.
        */

        let states = [

            {
                totals: {},
                slots: []
            }

        ];


        /*
            Обрабатываем пять слотов.
        */

        for (
            let slotIndex = 0;
            slotIndex < 5;
            slotIndex++
        ) {

            const next = [];


            for (
                const state of states
            ) {

                for (
                    const assignment
                    of assignments[slotIndex]
                ) {

                    const totals =
                        addAssignment(
                            state.totals,
                            assignment
                        );


                    const slots =
                        state.slots.concat([
                            assignment
                        ]);


                    const slotsLeft =
                        4 -
                        slotIndex;


                    /*
                        Отбрасываем только состояния,
                        которые физически не смогут
                        попасть в нужный диапазон.
                    */

                    if (
                        !stateStillPossible(
                            totals,
                            stats,
                            slotsLeft
                        )
                    ) {

                        continue;

                    }


                    next.push({

                        totals,

                        slots

                    });

                }

            }


            /*
                Сжимаем одинаковые состояния.
            */

            states =
                compressStates(
                    next,
                    stats
                );


            /*
                Повторная безопасная очистка.
            */

            states =
                pruneStates(
                    states,
                    stats,
                    4 - slotIndex
                );


            self.postMessage({

                type: "progress",

                slot:
                    slotIndex + 1,

                states:
                    states.length

            });

        }


        /*
            Ищем лучший финальный вариант.
        */

        let best =
            null;


        let bestScore =
            -Infinity;


        for (
            const state of states
        ) {

            if (
                !isValidFinalState(
                    state.totals,
                    stats
                )
            ) {

                continue;

            }


            const score =
                scoreState(
                    state.totals,
                    stats
                );


            if (
                score >
                bestScore
            ) {

                bestScore =
                    score;


                best =
                    state;

            }

        }


        self.postMessage({

            type: "done",

            result:
                best

        });


    } catch (error) {

        self.postMessage({

            type: "error",

            error:
                error &&
                error.message
                    ?
                    error.message
                    :
                    String(error)

        });

    }

};

`;


    const blob =
        new Blob(
            [workerCode],
            {
                type:
                    "application/javascript"
            }
        );


    return new Worker(
        URL.createObjectURL(blob)
    );

}


/* =========================================================
   ЗАПУСК РАСЧЁТА
   ========================================================= */

function startCalculation() {

    validationError.textContent =
        "";


    result.style.display =
        "none";


    progress.textContent =
        "";


    const validation =
        validate();


    if (
        !validation.valid
    ) {

        validationError.textContent =
            validation.error;

        return;

    }


    const stats =
        getEnabledStats();


    const procs =
        getProcs();


    calculateButton.disabled =
        true;


    calculateButton.textContent =
        "Идёт расчёт...";


    const worker =
        createWorker();


    worker.onmessage =
        function(event) {

            const data =
                event.data;


            /*
                ПРОГРЕСС
            */

            if (
                data.type ===
                "progress"
            ) {

                progress.textContent =
                    `Обработан слот ${data.slot}/5. ` +
                    `Состояний: ` +
                    `${data.states.toLocaleString("ru-RU")}`;

                return;

            }


            /*
                ОШИБКА
            */

            if (
                data.type ===
                "error"
            ) {

                progress.textContent =
                    "Ошибка расчёта: " +
                    data.error;


                calculateButton.disabled =
                    false;


                calculateButton.textContent =
                    "Рассчитать оптимальную комбинацию";


                worker.terminate();

                return;

            }


            /*
                ГОТОВО
            */

            if (
                data.type ===
                "done"
            ) {

                calculateButton.disabled =
                    false;


                calculateButton.textContent =
                    "Рассчитать оптимальную комбинацию";


                worker.terminate();


                if (
                    !data.result
                ) {

                    progress.textContent =
                        "Подходящей комбинации не найдено.";

                    return;

                }


                progress.textContent =
                    "Расчёт завершён.";


                showResult(
                    data.result,
                    stats,
                    procs
                );

            }

        };


    worker.onerror =
        function(error) {

            progress.textContent =
                "Ошибка расчёта.";


            calculateButton.disabled =
                false;


            calculateButton.textContent =
                "Рассчитать оптимальную комбинацию";


            worker.terminate();


            console.error(error);

        };


    worker.postMessage({

        stats,

        procs

    });

}


/* =========================================================
   ПОКАЗ РЕЗУЛЬТАТА
   ========================================================= */

function showResult(
    solution,
    stats,
    procs
) {

    result.style.display =
        "block";


    let html = "";


    html +=
        "<h3>Распределение характеристик</h3>";


    for (
        let slotIndex = 0;
        slotIndex <
        solution.slots.length;
        slotIndex++
    ) {

        const slot =
            solution.slots[slotIndex];


        html += `
            <div class="result-slot">

                <h3>
                    Слот ${slotIndex + 1}
                </h3>
        `;


        for (
            let cellIndex = 0;
            cellIndex <
            slot.length;
            cellIndex++
        ) {

            const item =
                slot[cellIndex];


            html += `
                <div class="result-stat">

                    <span>

                        Ячейка ${cellIndex + 1}:

                        <strong>
                            ${STAT_NAMES[item.stat]}
                        </strong>

                    </span>

                    <span>

                        ${item.proc} проков

                        (${formatPercent(item.value)})

                    </span>

                </div>
            `;

        }


        html +=
            "</div>";

    }


    html +=
        "<h3>Итоговые характеристики</h3>";


    const totals =
        solution.totals;


    for (
        const stat of stats
    ) {

        let value =
            totals[stat] || 0;


        /*
            Добавляем базовый крит.
        */

        if (
            stat === "crit"
        ) {

            value +=
                BASE_CRIT;

        }


        html += `
            <div class="result-stat total-row">

                <span>
                    ${STAT_NAMES[stat]}
                </span>

                <span>
                    ${formatPercent(value)}
                </span>

            </div>
        `;

    }


    html +=
        calculateUnused(
            totals,
            stats,
            procs
        );


    resultContent.innerHTML =
        html;

}


/* =========================================================
   ИСПОЛЬЗОВАНИЕ СТАТЫ
   ========================================================= */

function calculateUnused(
    totals,
    stats,
    procs
) {

    const totalProcPool =
        5 * 14;


    let usedProc =
        0;


    for (
        const slot of procs
    ) {

        usedProc +=
            slot[0] +
            slot[1] +
            slot[2];

    }


    return `

        <div class="unused">

            <strong>
                Использование статы
            </strong>


            <div class="result-stat">

                <span>
                    Проковый пул
                </span>

                <span>
                    ${totalProcPool}
                </span>

            </div>


            <div class="result-stat">

                <span>
                    Распределено проков
                </span>

                <span>
                    ${usedProc}
                </span>

            </div>


            <div class="result-stat">

                <span>
                    Ячеек
                </span>

                <span>
                    15 / 15
                </span>

            </div>


            <p>

                Большие проки приоритетно
                направляются в атаку и урон крита.
                Средние — в шанс крита.
                Маленькие и остаток — в проницание.

            </p>

        </div>

    `;

}


/* =========================================================
   ФОРМАТ ПРОЦЕНТОВ
   ========================================================= */

function formatPercent(
    value
) {

    if (
        value > 0
    ) {

        return `+${value}%`;

    }


    return `${value}%`;

}


/* =========================================================
   ОБНОВЛЕНИЕ ИСПОЛЬЗОВАНИЯ
   ========================================================= */

function updateUsage() {

    const stats =
        getEnabledStats();


    const procs =
        getProcs();


    let total =
        0;


    for (
        const slot of procs
    ) {

        total +=
            slot[0] +
            slot[1] +
            slot[2];

    }


    usage.innerHTML = `

        <div class="result-stat">

            <span>
                Общий проковый пул
            </span>

            <span>
                70
            </span>

        </div>


        <div class="result-stat">

            <span>
                Введено проков
            </span>

            <span>
                ${total}
            </span>

        </div>


        <div class="result-stat">

            <span>
                Выбрано характеристик
            </span>

            <span>
                ${stats.length}
            </span>

        </div>

    `;

}


/* =========================================================
   СОБЫТИЯ
   ========================================================= */

procCells.forEach(
    cell => {

        cell.addEventListener(
            "input",
            function() {

                updateProcSums();

                updateUsage();

            }
        );

    }
);


statChecks.forEach(
    check => {

        check.addEventListener(
            "change",
            function() {

                updateUsage();

            }
        );

    }
);


calculateButton.addEventListener(
    "click",
    startCalculation
);


/* =========================================================
   СТАРТОВОЕ СОСТОЯНИЕ
   ========================================================= */

updateProcSums();

updateUsage();

</script>
