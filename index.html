}

body {

    padding: 20px;

.container {

h1 {

h2 {

h3 {

}

.card {

    border-radius: 14px;
    padding: 20px;
    margin-bottom: 20px;
}

.stats-grid {

    grid-template-columns:

    gap: 10px;
}

.stat {
    background: #111827;
    padding: 12px;
    border-radius: 10px;
}

.stat label {
    display: flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;
}

.proc-grid {
    display: grid;
    grid-template-columns:

    gap: 10px;
    overflow-x: auto;
}

.slot {
    min-width: 120px;
    background: #111827;
    padding: 10px;
    border-radius: 10px;
}

.slot-title {
    text-align: center;
    font-weight: bold;
    margin-bottom: 10px;
}

.proc-cell {
    width: 100%;
    padding: 9px;
    margin-bottom: 8px;
    border: 1px solid #374151;
    border-radius: 7px;
    background: #1f2937;
    color: white;
    text-align: center;
    font-size: 16px;
}

.proc-cell:focus {
    outline: 2px solid #2563eb;
}

.proc-cell::placeholder {
    color: #9ca3af;
}

.proc-sum {
    text-align: center;
    font-size: 13px;
    margin-top: 5px;
}

.proc-sum.ok {
    color: #4ade80;
}

.proc-sum.bad {
    color: #f87171;
}

button {
    width: 100%;
    padding: 15px;
    border: none;
    border-radius: 10px;
    background: #2563eb;
    color: white;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    background: #1d4ed8;
}

button:disabled {
    background: #4b5563;
    cursor: not-allowed;
}

.progress {
    margin-top: 15px;
    text-align: center;
    color: #93c5fd;
    min-height: 20px;
}

.result {
    display: none;
}

.result-slot {
    margin-bottom: 15px;
    padding: 15px;
    background: #111827;
    border-radius: 10px;
}

.result-stat {
    display: flex;
    justify-content: space-between;
    gap: 15px;
    padding: 7px 0;
    border-bottom: 1px solid #374151;
}

.result-stat:last-child {
    border-bottom: none;
}

.summary-grid {
    display: grid;
    grid-template-columns:
        repeat(auto-fit, minmax(230px, 1fr));
    gap: 10px;
}

.summary-card {

    padding: 14px;

.summary-card strong {

.big-value {

}

.good {
    color: #4ade80;
}

.warning {
    color: #facc15;
}

.bad {
    color: #f87171;
}

.info {
    color: #93c5fd;
}

.small {
    font-size: 13px;
    color: #9ca3af;
    line-height: 1.5;
}

.unused {
    margin-top: 20px;
    padding: 15px;
    border-radius: 10px;
    background: #172554;
}

.error {
    color: #f87171;
    margin-top: 10px;

.success {
    color: #4ade80;

.loss-table {

.loss-table th,

    }

    .result-stat {
        font-size: 14px;
    }

    .loss-table {
        font-size: 13px;
    }

<script>

"use strict";


/* =========================================================
   НАЗВАНИЯ
   ========================================================= */

const STAT_NAMES = {

    crit:
        "Шанс крита",

    penetration:
        "Проницание",

    accuracy:
        "Точность",

    critDamage:
        "Урон крита",

    attack:
        "Атака",

    meter:
        "Прирост шкалы",

    cooldown:
        "Перезарядка приёмов"

};


/* =========================================================
   ДИАПАЗОНЫ
   =========================================================

   min / max = допустимый итог.

   target = желаемое значение.

   Для attack и meter target = null,
   потому что там нет фиксированной цели.
   ========================================================= */

const RANGES = {

    crit: {

        min: 70,
        max: 90,
        target: 80

    },

    penetration: {

        min: 45,
        max: 55,
        target: 50

    },

    accuracy: {

        min: 45,
        max: 55,
        target: 50

    },

    critDamage: {

        min: 100,
        max: 120,
        target: 105

    },

    attack: {

        min: 0,
        max: 225,
        target: null

    },

    meter: {

        min: 0,
        max: 100,
        target: null

    },

    cooldown: {

        min: -30,
        max: -20,
        target: -25

    }

};


/* =========================================================
   БАЗОВЫЕ ЗНАЧЕНИЯ
   ========================================================= */

const BASE_VALUES = {

    crit: 20,

    critDamage: 35,

    cooldown: -15

};


/* =========================================================
   ПРИОРИТЕТ ПРИ ПОЛНОСТЬЮ РАВНЫХ ВАРИАНТАХ
   =========================================================

   ВАЖНО:

   Это НЕ вес.

   Мы не говорим:
   "атака важнее урона крита в 1000 раз".

   Сначала алгоритм решает:

   1. допустим ли вариант;
   2. какой недобор;
   3. какой перелив;
   4. и только при равенстве использует
      этот порядок как tie-break.

   Если позже захочешь сделать,
   например, урон крита выше атаки,
   достаточно поменять порядок.

   Сейчас:
   Атака -> Урон крита -> Крит ->
   Проницание -> Точность -> Шкала ->
   Cooldown.
   ========================================================= */

const TIE_BREAK_PRIORITY = [

    "attack",
    "critDamage",
    "crit",
    "penetration",
    "accuracy",
    "meter",
    "cooldown"

];


/* =========================================================
   DOM
   ========================================================= */

const procCells =
    [
        ...document.querySelectorAll(
            ".proc-cell"
        )
    ];


const statChecks =
    [
        ...document.querySelectorAll(
            ".stat-check"
        )
    ];


const calculateButton =
    document.getElementById(
        "calculateButton"
    );


const progress =
    document.getElementById(
        "progress"
    );


const validationError =
    document.getElementById(
        "validationError"
    );


const result =
    document.getElementById(
        "result"
    );


const resultContent =
    document.getElementById(
        "resultContent"
    );


const usage =
    document.getElementById(
        "usage"
    );



/* =========================================================
   ПОЛУЧИТЬ ПРОКИ
   ========================================================= */

function getProcs() {

    const slots = [];


    for (
        let slot = 0;
        slot < 5;
        slot++
    ) {

        const cells =
            procCells.filter(
                cell =>
                    Number(
                        cell.dataset.slot
                    ) === slot
            );


        const values =
            cells.map(
                cell => {

                    if (
                        cell.value.trim() === ""
                    ) {

                        return 0;

                    }


                    let value =
                        Number(
                            cell.value
                        );


                    if (
                        !Number.isFinite(value)
                    ) {

                        return 0;

                    }


                    value =
                        Math.floor(
                            value
                        );


                    return Math.max(
                        0,
                        Math.min(
                            14,
                            value
                        )
                    );

                }
            );


        slots.push(
            values
        );

    }


    return slots;

}


/* =========================================================
   ВЫБРАННЫЕ СТАТЫ
   ========================================================= */

function getEnabledStats() {

    return statChecks
        .filter(
            check =>
                check.checked
        )
        .map(
            check =>
                check.value
        );

}


/* =========================================================
   ПРОВЕРКА ВВОДА
   ========================================================= */

function validate() {

    const stats =
        getEnabledStats();


    const procs =
        getProcs();


    if (
        stats.length < 3
    ) {

        return {

            valid: false,

            error:
                "Нужно выбрать минимум 3 характеристики."

        };

    }


    for (
        let i = 0;
        i < procs.length;
        i++
    ) {

        const sum =
            procs[i][0] +
            procs[i][1] +
            procs[i][2];


        if (
            sum !== 14
        ) {

            return {

                valid: false,

                error:
                    `В слоте ${i + 1} сумма ` +
                    `проков должна быть 14. ` +
                    `Сейчас: ${sum}.`

            };

        }

    }


    return {

        valid: true,

        error: ""

    };

}


/* =========================================================
   ОБНОВИТЬ СУММЫ
   ========================================================= */

function updateProcSums() {

    const slots =
        [
            ...document.querySelectorAll(
                ".slot"
            )
        ];


    slots.forEach(
        slot => {

            const inputs =
                [
                    ...slot.querySelectorAll(
                        ".proc-cell"
                    )
                ];


            const sum =
                inputs.reduce(
                    (
                        total,
                        input
                    ) => {

                        const value =
                            Number(
                                input.value
                            );


                        if (
                            !Number.isFinite(value)
                        ) {

                            return total;

                        }


                        return total + value;

                    },
                    0
                );


            const span =
                slot.querySelector(
                    ".proc-sum span"
                );


            const box =
                slot.querySelector(
                    ".proc-sum"
                );


            span.textContent =
                sum;


            box.classList.remove(
                "ok",
                "bad"
            );


            if (
                sum === 14
            ) {

                box.classList.add(
                    "ok"
                );

            } else {

                box.classList.add(
                    "bad"
                );

            }

        }
    );

}


/* =========================================================
   ЗНАЧЕНИЕ ПРОКА
   ========================================================= */

function procValue(
    stat,
    proc
) {

    /*
        Атака:

        0 -> 6
        1 -> 9
        2 -> 12
        ...
        14 -> 48
    */

    if (
        stat === "attack"
    ) {

        return 6 +
            proc * 3;

    }


    /*
        Обычный стат:

        0 -> 3
        1 -> 6
        2 -> 9
        ...
        14 -> 45
    */

    const value =
        3 *
        (
            proc + 1
        );


    /*
        Cooldown:

        0 -> -3
        1 -> -6
        ...
        14 -> -45
    */

    if (
        stat === "cooldown"
    ) {

        return -value;

    }


    return value;

}


/* =========================================================
   ИТОГОВОЕ ЗНАЧЕНИЕ
   ========================================================= */

function finalValue(
    stat,
    procTotal
) {

    return procTotal +
        (
            BASE_VALUES[stat] || 0
        );

}


/* =========================================================
   ДИАПАЗОН ПРОКОВ
   =========================================================

   Переводим диапазон итоговой статы
   в диапазон, который должен дать
   именно проками.
   ========================================================= */

function getProcRange(stat) {

    const range =
        RANGES[stat];


    const base =
        BASE_VALUES[stat] || 0;


    return {

        min:
            range.min - base,

        max:
            range.max - base

    };

}


/* =========================================================
   НОРМАЛИЗОВАННАЯ ОЦЕНКА
   =========================================================

   Возвращает:

   deficit =
       сколько не хватает до цели.

   overflow =
       сколько выше цели.

   Для stats без target:

   deficit = 0
   overflow = 0

   потому что там цель не задана.
   ========================================================= */

function analyzeStat(
    stat,
    value
) {

    const range =
        RANGES[stat];


    if (
        range.target === null
    ) {

        return {

            deficit: 0,

            overflow: 0,

            distance: 0

        };

    }


    const deficit =
        Math.max(
            0,
            range.target - value
        );


    const overflow =
        Math.max(
            0,
            value - range.target
        );


    return {

        deficit,

        overflow,

        distance:
            Math.abs(
                value -
                range.target
            )

    };

}


/* =========================================================
   ПРОВЕРКА ФИНАЛЬНОГО ВАРИАНТА
   ========================================================= */

function isValidFinal(
    totals,
    stats
) {

    for (
        const stat of stats
    ) {

        const value =
            finalValue(
                stat,
                totals[stat] || 0
            );


        const range =
            RANGES[stat];


        if (
            value < range.min ||
            value > range.max
        ) {

            return false;

        }

    }


    return true;

}


/* =========================================================
   ОБЩАЯ ОЦЕНКА ВАРИАНТА
   =========================================================

   Порядок:

   1. Минимум общего недобора.

   2. Минимум общего перелива.

   3. Минимум общего отклонения.

   4. Tie-break по приоритету.

   Таким образом:

   50% при цели 50%
   лучше 52%.

   Но 52% допустимо.

   А 48% имеет реальный недобор 2%.
   ========================================================= */

function compareSolutions(
    a,
    b,
    stats
) {

    if (
        !b
    ) {

        return true;

    }


    let aDeficit =
        0;

    let bDeficit =
        0;


    let aOverflow =
        0;

    let bOverflow =
        0;


    let aDistance =
        0;

    let bDistance =
        0;


    for (
        const stat of stats
    ) {

        const av =
            finalValue(
                stat,
                a.totals[stat] || 0
            );


        const bv =
            finalValue(
                stat,
                b.totals[stat] || 0
            );


        const aa =
            analyzeStat(
                stat,
                av
            );


        const ba =
            analyzeStat(
                stat,
                bv
            );


        aDeficit +=
            aa.deficit;


        bDeficit +=
            ba.deficit;


        aOverflow +=
            aa.overflow;


        bOverflow +=
            ba.overflow;


        aDistance +=
            aa.distance;


        bDistance +=
            ba.distance;

    }


    /*
        1. Недобор.
    */

    if (
        aDeficit !==
        bDeficit
    ) {

        return (
            aDeficit <
            bDeficit
        );

    }


    /*
        2. Перелив.
    */

    if (
        aOverflow !==
        bOverflow
    ) {

        return (
            aOverflow <
            bOverflow
        );

    }


    /*
        3. Общее расстояние.
    */

    if (
        aDistance !==
        bDistance
    ) {

        return (
            aDistance <
            bDistance
        );

    }


    /*
        4. Tie-break.
    */

    for (
        const stat
        of TIE_BREAK_PRIORITY
    ) {

        if (
            !stats.includes(stat)
        ) {

            continue;

        }


        const av =
            a.totals[stat] || 0;


        const bv =
            b.totals[stat] || 0;


        /*
            Для cooldown
            меньше = лучше.
        */

        if (
            stat === "cooldown"
        ) {

            if (
                av !== bv
            ) {

                return av < bv;

            }

        } else {

            if (
                av !== bv
            ) {

                return av > bv;

            }

        }

    }


    return false;

}


/* =========================================================
   СОЗДАТЬ WORKER
   ========================================================= */

function createWorker() {

    const workerCode = `

"use strict";


const RANGES =
${JSON.stringify(RANGES)};


const BASE_VALUES =
${JSON.stringify(BASE_VALUES)};


const TIE_BREAK_PRIORITY =
${JSON.stringify(TIE_BREAK_PRIORITY)};


/* =====================================================
   PROC VALUE
   ===================================================== */

function procValue(
    stat,
    proc
) {

    if (
        stat === "attack"
    ) {

        return 6 +
            proc * 3;

    }


    const value =
        3 *
        (
            proc + 1
        );


    if (
        stat === "cooldown"
    ) {

        return -value;

    }


    return value;

}


/* =====================================================
   FINAL VALUE
   ===================================================== */

function finalValue(
    stat,
    procTotal
) {

    return procTotal +
        (
            BASE_VALUES[stat] || 0
        );

}


/* =====================================================
   PROC RANGE
   ===================================================== */

function getProcRange(stat) {

    const range =
        RANGES[stat];


    const base =
        BASE_VALUES[stat] || 0;


    return {

        min:
            range.min - base,

        max:
            range.max - base

    };

}


/* =====================================================
   ANALYZE
   ===================================================== */

function analyzeStat(
    stat,
    value
) {

    const range =
        RANGES[stat];


    if (
        range.target === null
    ) {

        return {

            deficit: 0,

            overflow: 0,

            distance: 0

        };

    }


    const deficit =
        Math.max(
            0,
            range.target - value
        );


    const overflow =
        Math.max(
            0,
            value - range.target
        );


    return {

        deficit,

        overflow,

        distance:
            Math.abs(
                value -
                range.target
            )

    };

}


/* =====================================================
   ASSIGNMENTS
   ===================================================== */

function generateAssignments(
    stats,
    procValues
) {

    const result = [];


    for (
        let a = 0;
        a < stats.length;
        a++
    ) {

        for (
            let b = 0;
            b < stats.length;
            b++
        ) {

            if (
                b === a
            ) {

                continue;

            }


            for (
                let c = 0;
                c < stats.length;
                c++
            ) {

                if (
                    c === a ||
                    c === b
                ) {

                    continue;

                }


                result.push([

                    {

                        stat:
                            stats[a],

                        proc:
                            procValues[0],

                        value:
                            procValue(
                                stats[a],
                                procValues[0]
                            )

                    },

                    {

                        stat:
                            stats[b],

                        proc:
                            procValues[1],

                        value:
                            procValue(
                                stats[b],
                                procValues[1]
                            )

                    },

                    {

                        stat:
                            stats[c],

                        proc:
                            procValues[2],

                        value:
                            procValue(
                                stats[c],
                                procValues[2]
                            )

                    }

                ]);

            }

        }

    }


    return result;

}


/* =====================================================
   ADD ASSIGNMENT
   ===================================================== */

function addAssignment(
    totals,
    assignment
) {

    const next = {
        ...totals
    };


    for (
        const item of assignment
    ) {

        next[item.stat] =
            (
                next[item.stat] || 0
            ) +
            item.value;

    }


    return next;

}


/* =====================================================
   POSSIBLE RANGE
   ===================================================== */

function possibleAfterSlots(
    stat,
    current,
    slotsLeft
) {

    /*
        Attack:

        один слот:
        +6 ... +48
    */

    if (
        stat === "attack"
    ) {

        return {

            min:
                current,

            max:
                current +
                slotsLeft * 48

        };

    }


    /*
        Cooldown:

        один слот:
        -45 ... -3
    */

    if (
        stat === "cooldown"
    ) {

        return {

            min:
                current -
                slotsLeft * 45,

            max:
                current -
                slotsLeft * 3

        };

    }


    /*
        Остальные:

        один слот:
        +3 ... +45
    */

    return {

        min:
            current,

        max:
            current +
            slotsLeft * 45

    };

}


/* =====================================================
   STATE POSSIBLE
   ===================================================== */

function statePossible(
    totals,
    stats,
    slotsLeft
) {

    for (
        const stat of stats
    ) {

        const range =
            getProcRange(stat);


        const current =
            totals[stat] || 0;


        const possible =
            possibleAfterSlots(
                stat,
                current,
                slotsLeft
            );


        if (
            possible.max <
            range.min
        ) {

            return false;

        }


        if (
            possible.min >
            range.max
        ) {

            return false;

        }

    }


    return true;

}


/* =====================================================
   FINAL VALID
   ===================================================== */

function validFinal(
    totals,
    stats
) {

    for (
        const stat of stats
    ) {

        const range =
            getProcRange(stat);


        const value =
            totals[stat] || 0;


        if (
            value < range.min ||
            value > range.max
        ) {

            return false;

        }

    }


    return true;

}


/* =====================================================
   COMPARE SOLUTIONS
   ===================================================== */

function better(
    a,
    b,
    stats
) {

    if (
        !b
    ) {

        return true;

    }


    let aDeficit =
        0;

    let bDeficit =
        0;


    let aOverflow =
        0;

    let bOverflow =
        0;


    let aDistance =
        0;

    let bDistance =
        0;


    for (
        const stat of stats
    ) {

        const av =
            finalValue(
                stat,
                a.totals[stat] || 0
            );


        const bv =
            finalValue(
                stat,
                b.totals[stat] || 0
            );


        const aa =
            analyzeStat(
                stat,
                av
            );


        const ba =
            analyzeStat(
                stat,
                bv
            );


        aDeficit +=
            aa.deficit;


        bDeficit +=
            ba.deficit;


        aOverflow +=
            aa.overflow;


        bOverflow +=
            ba.overflow;


        aDistance +=
            aa.distance;


        bDistance +=
            ba.distance;

    }


    /*
        Приоритет 1:
        минимум недобора.
    */

    if (
        aDeficit !==
        bDeficit
    ) {

        return (
            aDeficit <
            bDeficit
        );

    }


    /*
        Приоритет 2:
        минимум перелива.
    */

    if (
        aOverflow !==
        bOverflow
    ) {

        return (
            aOverflow <
            bOverflow
        );

    }


    /*
        Приоритет 3:
        минимальное расстояние
        от целевых значений.
    */

    if (
        aDistance !==
        bDistance
    ) {

        return (
            aDistance <
            bDistance
        );

    }


    /*
        Приоритет 4:
        tie-break.
    */

    for (
        const stat
        of TIE_BREAK_PRIORITY
    ) {

        if (
            !stats.includes(stat)
        ) {

            continue;

        }


        const av =
            a.totals[stat] || 0;


        const bv =
            b.totals[stat] || 0;


        if (
            stat === "cooldown"
        ) {

            if (
                av !== bv
            ) {

                return av < bv;

            }

        } else {

            if (
                av !== bv
            ) {

                return av > bv;

            }

        }

    }


    return false;

}


/* =====================================================
   STATE KEY
   ===================================================== */

function makeKey(
    totals,
    stats
) {

    return stats
        .map(
            stat =>
                stat +
                ":" +
                (
                    totals[stat] || 0
                )
        )
        .join("|");

}


/* =====================================================
   COMPRESS
   ===================================================== */

function compressStates(
    states,
    stats
) {

    const map =
        new Map();


    for (
        const state of states
    ) {

        const key =
            makeKey(
                state.totals,
                stats
            );


        const old =
            map.get(key);


        if (
            !old ||
            better(
                state,
                old,
                stats
            )
        ) {

            map.set(
                key,
                state
            );

        }

    }


    return [
        ...map.values()
    ];

}


/* =====================================================
   WORKER
   ===================================================== */

self.onmessage =
function(event) {

    try {

        const data =
            event.data;


        const stats =
            data.stats;


        const procs =
            data.procs;


        /*
            Каждый слот имеет 3 проковых
            значения.

            Для каждой тройки создаём все
            варианты назначения трёх значений
            трём разным выбранным статам.
        */

        const assignments =
            procs.map(
                slot =>
                    generateAssignments(
                        stats,
                        slot
                    )
            );


        let states = [

            {

                totals: {},

                slots: []

            }

        ];


        /*
            DP по пяти слотам.
        */

        for (
            let slotIndex = 0;
            slotIndex < 5;
            slotIndex++
        ) {

            const next = [];


            for (
                const state of states
            ) {

                for (
                    const assignment
                    of assignments[slotIndex]
                ) {

                    const totals =
                        addAssignment(
                            state.totals,
                            assignment
                        );


                    const slotsLeft =
                        4 -
                        slotIndex;


                    /*
                        Отбрасываем состояние,
                        если оно уже физически
                        не может попасть в диапазон.
                    */

                    if (
                        !statePossible(
                            totals,
                            stats,
                            slotsLeft
                        )
                    ) {

                        continue;

                    }


                    next.push({

                        totals,

                        slots:
                            state.slots.concat([
                                assignment
                            ])

                    });

                }

            }


            /*
                Одинаковые итоговые состояния
                объединяем.
            */

            states =
                compressStates(
                    next,
                    stats
                );


            self.postMessage({

                type:
                    "progress",

                slot:
                    slotIndex + 1,

                states:
                    states.length

            });

        }


        /*
            Ищем лучший допустимый
            конечный вариант.
        */

        let best =
            null;


        for (
            const state of states
        ) {

            if (
                !validFinal(
                    state.totals,
                    stats
                )
            ) {

                continue;

            }


            if (
                better(
                    state,
                    best,
                    stats
                )
            ) {

                best =
                    state;

            }

        }


        self.postMessage({

            type:
                "done",

            result:
                best

        });

    }

    catch (
        error
    ) {

        self.postMessage({

            type:
                "error",

            error:
                error &&
                error.message
                    ?
                    error.message
                    :
                    String(error)

        });

    }

};

`;


    const blob =
        new Blob(
            [workerCode],
            {
                type:
                    "application/javascript"
            }
        );


    return new Worker(
        URL.createObjectURL(blob)
    );

}


/* =========================================================
   ФОРМАТ ПРОЦЕНТА
   ========================================================= */

function formatPercent(
    value
) {

    if (
        value > 0
    ) {

        return `+${value}%`;

    }


    return `${value}%`;

}


/* =========================================================
   КЛАСС
   ========================================================= */

function valueClass(
    stat,
    value
) {

    const range =
        RANGES[stat];


    if (
        value < range.min ||
        value > range.max
    ) {

        return "bad";

    }


    if (
        range.target === null
    ) {

        return "good";

    }


    if (
        value === range.target
    ) {

        return "good";

    }


    return "warning";

}


/* =========================================================
   СТАТУС
   ========================================================= */

function getStatus(
    stat,
    value
) {

    const range =
        RANGES[stat];


    if (
        value < range.min
    ) {

        return {

            text:
                `Ниже допустимого минимума ` +
                `на ${formatPercent(
                    range.min - value
                )}`,

            className:
                "bad"

        };

    }


    if (
        value > range.max
    ) {

        return {

            text:
                `Выше допустимого максимума ` +
                `на ${formatPercent(
                    value - range.max
                )}`,

            className:
                "bad"

        };

    }


    if (
        range.target === null
    ) {

        return {

            text:
                "В допустимом диапазоне",

            className:
                "good"

        };

    }


    const analysis =
        analyzeStat(
            stat,
            value
        );


    if (
        analysis.deficit > 0
    ) {

        return {

            text:
                `Недобор: ${formatPercent(
                    analysis.deficit
                )}`,

            className:
                "bad"

        };

    }


    if (
        analysis.overflow > 0
    ) {

        return {

            text:
                `Перелив: +${analysis.overflow}%`,

            className:
                "warning"

        };

    }


    return {

        text:
            "Точное попадание в цель",

        className:
            "good"

    };

}

/* =========================================================
   ЗАПУСК
   ========================================================= */

function startCalculation() {

    validationError.textContent =
        "";


    result.style.display =
        "none";


    progress.textContent =
        "";


    const validation =
        validate();


    if (
        !validation.valid
    ) {

        validationError.textContent =
            validation.error;

        return;

    }


    const stats =
        getEnabledStats();


    const procs =
        getProcs();


    calculateButton.disabled =
        true;


    calculateButton.textContent =
        "Идёт расчёт...";


    const worker =
        createWorker();


    worker.onmessage =
        function(event) {

            const data =
                event.data;


            if (
                data.type ===
                "progress"
            ) {

                progress.textContent =
                    `Обработан слот ` +
                    `${data.slot}/5. ` +
                    `Состояний: ` +
                    `${data.states.toLocaleString(
                        "ru-RU"
                    )}`;

                return;

            }


            if (
                data.type ===
                "error"
            ) {

                progress.textContent =
                    "Ошибка расчёта: " +
                    data.error;


                calculateButton.disabled =
                    false;


                calculateButton.textContent =
                    "Рассчитать оптимальную комбинацию";


                worker.terminate();

                return;

            }


            if (
                data.type ===
                "done"
            ) {

                calculateButton.disabled =
                    false;


                calculateButton.textContent =
                    "Рассчитать оптимальную комбинацию";


                worker.terminate();


                if (
                    !data.result
                ) {

                    progress.textContent =
                        "Допустимой комбинации " +
                        "не найдено.";

                    return;

                }


                progress.textContent =
                    "Расчёт завершён.";


                showResult(
                    data.result,
                    stats
                );

            }

        };


    worker.onerror =
        function(error) {

            console.error(
                error
            );


            progress.textContent =
                "Произошла ошибка расчёта.";


            calculateButton.disabled =
                false;


            calculateButton.textContent =
                "Рассчитать оптимальную комбинацию";


            worker.terminate();

        };


    worker.postMessage({

        stats,

        procs

    });

}


/* =========================================================
   СОБЫТИЯ
   ========================================================= */

procCells.forEach(
    cell => {

        cell.addEventListener(
            "input",
            function() {

                if (
                    cell.value !== ""
                ) {

                    let value =
                        Number(
                            cell.value
                        );


                    if (
                        Number.isFinite(value)
                    ) {

                        value =
                            Math.floor(
                                value
                            );


                        value =
                            Math.max(
                                0,
                                Math.min(
                                    14,
                                    value
                                )
                            );


                        cell.value =
                            value;

                    }

                }


                updateProcSums();

                updateUsage();

            }
        );

    }
);


statChecks.forEach(
    check => {

        check.addEventListener(
            "change",
            function() {

                updateUsage();

            }
        );

    }
);


calculateButton.addEventListener(
    "click",
    startCalculation
);


/* =========================================================
   СТАРТ
   ========================================================= */

updateProcSums();

updateUsage();

</script>

</body>
