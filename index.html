<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Калькулятор характеристик</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 20px;
    background: #111827;
    color: #f3f4f6;
    font-family: Arial, sans-serif;
}

.container {
    max-width: 1100px;
    margin: auto;
}

h1 {
    text-align: center;
    margin-bottom: 25px;
}

h2 {
    margin-top: 30px;
}

.card {
    background: #1f2937;
    border-radius: 14px;
    padding: 20px;
    margin-bottom: 20px;
}

.stats-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 10px;
}

.stat {
    background: #111827;
    padding: 12px;
    border-radius: 10px;
}

.stat label {
    display: flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;
}

.proc-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 10px;
    overflow-x: auto;
}

.slot {
    min-width: 110px;
    background: #111827;
    padding: 10px;
    border-radius: 10px;
}

.slot-title {
    text-align: center;
    font-weight: bold;
    margin-bottom: 10px;
}

.proc-cell {
    width: 100%;
    padding: 9px;
    margin-bottom: 8px;
    border: 1px solid #374151;
    border-radius: 7px;
    background: #1f2937;
    color: white;
    text-align: center;
    font-size: 16px;
}

.proc-sum {
    text-align: center;
    font-size: 13px;
    margin-top: 5px;
}

.proc-sum.ok {
    color: #4ade80;
}

.proc-sum.bad {
    color: #f87171;
}

button {
    width: 100%;
    padding: 15px;
    border: none;
    border-radius: 10px;
    background: #2563eb;
    color: white;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    background: #1d4ed8;
}

button:disabled {
    background: #4b5563;
    cursor: not-allowed;
}

.progress {
    margin-top: 15px;
    text-align: center;
    color: #93c5fd;
}

.result {
    display: none;
}

.result-slot {
    margin-bottom: 15px;
    padding: 15px;
    background: #111827;
    border-radius: 10px;
}

.result-slot h3 {
    margin-top: 0;
}

.result-stat {
    display: flex;
    justify-content: space-between;
    padding: 5px 0;
    border-bottom: 1px solid #374151;
}

.result-stat:last-child {
    border-bottom: none;
}

.total-row {
    font-weight: bold;
    font-size: 17px;
}

.unused {
    margin-top: 15px;
    padding: 15px;
    border-radius: 10px;
    background: #172554;
}

.error {
    color: #f87171;
    margin-top: 10px;
}

@media (max-width: 600px) {
    body {
        padding: 10px;
    }

    .card {
        padding: 14px;
    }

    .proc-grid {
        grid-template-columns: repeat(5, 100px);
    }
}
</style>
</head>

<body>

<div class="container">

<h1>Калькулятор характеристик</h1>

<div class="card">

    <h2>Выбор характеристик</h2>

    <div class="stats-grid">

        <div class="stat">
            <label>
                <input type="checkbox" class="stat-check" value="crit" checked>

        </div>

        <div class="stat">
            <label>
                <input type="checkbox" class="stat-check" value="penetration" checked>

        </div>

        <div class="stat">
            <label>
                <input type="checkbox" class="stat-check" value="accuracy" checked>

        </div>

        <div class="stat">
            <label>
                <input type="checkbox" class="stat-check" value="critDamage" checked>

        <div class="stat">
            <label>

    <h2>Проки</h2>

    </p>

    <div class="proc-grid">

        <div class="slot">

            <input class="proc-cell" type="number" min="0" max="14" value="5" data-slot="0">
            <input class="proc-cell" type="number" min="0" max="14" value="5" data-slot="0">
            <input class="proc-cell" type="number" min="0" max="14" value="4" data-slot="0">

        <div class="slot">

            <input class="proc-cell" type="number" min="0" max="14" value="5" data-slot="1">
            <input class="proc-cell" type="number" min="0" max="14" value="4" data-slot="1">

            <div class="proc-sum">Сумма: <span>14</span></div>
        </div>


        <div class="slot">
            <div class="slot-title">Слот 3</div>

            <input class="proc-cell" type="number" min="0" max="14" value="5" data-slot="2">
            <input class="proc-cell" type="number" min="0" max="14" value="5" data-slot="2">
            <input class="proc-cell" type="number" min="0" max="14" value="4" data-slot="2">

            <div class="proc-sum">Сумма: <span>14</span></div>
        </div>


        <div class="slot">
            <div class="slot-title">Слот 4</div>

            <input class="proc-cell" type="number" min="0" max="14" value="5" data-slot="3">
            <input class="proc-cell" type="number" min="0" max="14" value="5" data-slot="3">
            <input class="proc-cell" type="number" min="0" max="14" value="4" data-slot="3">

            <input class="proc-cell" type="number" min="0" max="14" value="5" data-slot="4">
            <input class="proc-cell" type="number" min="0" max="14" value="5" data-slot="4">

<div class="card">

</div>


<div class="card">

    <button id="calculateButton">
        Рассчитать оптимальную комбинацию
    </button>

    <div id="progress" class="progress"></div>

</div>


<div class="card result" id="result">

    <h2>Результат</h2>

    <div id="resultContent"></div>

</div>

</div>


<script>

"use strict";


/* =========================================================
   НАСТРОЙКИ ХАРАКТЕРИСТИК
   ========================================================= */

const STAT_NAMES = {

    crit: "Шанс крита",

    penetration: "Проницание",

    accuracy: "Точность",

    critDamage: "Урон крита",

    attack: "Атака",

    meter: "Прирост шкалы",

    cooldown: "Перезарядка приёмов"

};


/*
    Все значения считаются в проках.

    0 проков:
    обычные статы = +3%
    cooldown = -3%

    Каждый прок добавляет ещё 3%.
*/

const RANGES = {

    crit: {
        min: 70,
        max: 90,
        target: 80
    },

    penetration: {
        min: 45,
        max: 55,
        target: 50
    },

    accuracy: {
        min: 45,
        max: 55,
        target: 50
    },

    critDamage: {
        min: 95,
        max: 120,
        target: 105
    },

    attack: {
        min: 0,
        max: 225,
        target: 0
    },

    meter: {
        min: 0,
        max: 100,
        target: 0
    },

    cooldown: {
        min: -50,
        max: 0,
        target: -30
    }

};


/*
    Базовый шанс крита персонажа.
    Он НЕ занимает прок.
*/

const BASE_CRIT = 20;


/* =========================================================
   DOM
   ========================================================= */

const procCells = [...document.querySelectorAll(".proc-cell")];

const statChecks = [...document.querySelectorAll(".stat-check")];

const calculateButton =
    document.getElementById("calculateButton");

const progress =
    document.getElementById("progress");

const validationError =
    document.getElementById("validationError");

const result =
    document.getElementById("result");

const resultContent =
    document.getElementById("resultContent");

const usage =
    document.getElementById("usage");


/* =========================================================
   ПРОКИ
   ========================================================= */

function getProcs() {

    const slots = [];

    for (let slot = 0; slot < 5; slot++) {

        const cells = procCells.filter(
            cell => Number(cell.dataset.slot) === slot
        );

        const values = cells.map(cell => {

            let value = Number(cell.value);

            if (!Number.isFinite(value)) {
                value = 0;
            }

            value = Math.max(0, Math.min(14, Math.floor(value)));

            return value;

        });

        slots.push(values);
    }

    return slots;
}


/* =========================================================
   ВЫБРАННЫЕ ХАРАКТЕРИСТИКИ
   ========================================================= */

function getEnabledStats() {

    return statChecks
        .filter(check => check.checked)
        .map(check => check.value);

}


/* =========================================================
   ПРОВЕРКА
   ========================================================= */

function validate() {

    const procs = getProcs();

    if (getEnabledStats().length < 3) {

        return {
            valid: false,
            error: "Нужно выбрать минимум 3 характеристики."
        };

    }


    for (let i = 0; i < procs.length; i++) {

        const sum =
            procs[i][0] +
            procs[i][1] +
            procs[i][2];

        if (sum !== 14) {

            return {
                valid: false,
                error:
                    `В слоте ${i + 1} сумма проков должна быть 14. Сейчас: ${sum}.`
            };

        }

    }


    return {
        valid: true,
        error: ""
    };

}


/* =========================================================
   ОТОБРАЖЕНИЕ СУММ ПРОКОВ
   ========================================================= */

function updateProcSums() {

    const slots =
        document.querySelectorAll(".slot");

    slots.forEach(slot => {

        const inputs =
            [...slot.querySelectorAll(".proc-cell")];

        const sum =
            inputs.reduce(
                (total, input) =>
                    total + Number(input.value || 0),
                0
            );

        const span =
            slot.querySelector(".proc-sum span");

        const box =
            slot.querySelector(".proc-sum");

        span.textContent = sum;

        box.classList.remove("ok", "bad");

        if (sum === 14) {
            box.classList.add("ok");
        } else {
            box.classList.add("bad");
        }

    });

}


/* =========================================================
   ЗНАЧЕНИЕ ОДНОГО ПРОКА
   ========================================================= */

function procValue(stat, proc) {

    /*
        0 проков = 3%
        1 прок = 6%
        ...
        14 проков = 45%
    */

    const value = 3 * (proc + 1);

    if (stat === "cooldown") {
        return -value;
    }

    return value;

}


/* =========================================================
   ГЕНЕРАЦИЯ ВАРИАНТОВ ДЛЯ ОДНОГО СЛОТА
   ========================================================= */

function generateAssignments(stats, procValues) {

    const result = [];

    /*
        В одном слоте три РАЗНЫЕ характеристики.

        Например:

        [crit, penetration, accuracy]

        [crit, accuracy, penetration]

        и т.д.

        Если выбрано 7 статов:
        7 * 6 * 5 = 210 вариантов.

        Но это только 210 вариантов ДЛЯ ОДНОГО СЛОТА.
        Мы больше НЕ делаем 210^5.
    */

    for (let a = 0; a < stats.length; a++) {

        for (let b = 0; b < stats.length; b++) {

            if (b === a) continue;

            for (let c = 0; c < stats.length; c++) {

                if (c === a || c === b) continue;

                const assignment = [

                    {
                        stat: stats[a],
                        proc: procValues[0],
                        value: procValue(stats[a], procValues[0])
                    },

                    {
                        stat: stats[b],
                        proc: procValues[1],
                        value: procValue(stats[b], procValues[1])
                    },

                    {
                        stat: stats[c],
                        proc: procValues[2],
                        value: procValue(stats[c], procValues[2])
                    }

                ];

                result.push(assignment);

            }

        }

    }

    return result;

}


/* =========================================================
   СОЗДАНИЕ НОВЫХ ИТОГОВ
   ========================================================= */

function addAssignment(totals, assignment) {

    const result = { ...totals };

    for (const item of assignment) {

        result[item.stat] =
            (result[item.stat] || 0) + item.value;

    }

    return result;

}


/* =========================================================
   ПРОВЕРКА: МОЖЕТ ЛИ СОСТОЯНИЕ БЫТЬ ДОСТИЖИМО
   ========================================================= */

function stateStillPossible(
    totals,
    stats,
    slotsLeft
) {

    for (const stat of stats) {

        const range = RANGES[stat];

        const current =
            totals[stat] || 0;


        /*
            Каждый оставшийся слот даёт
            максимум 45% этой характеристики.
        */

        const maxPossible =
            current + slotsLeft * 45;

        /*
            Для cooldown максимум по модулю
            также 45% за слот.
        */

        const minPossible =
            current - slotsLeft * 45;


        if (stat !== "cooldown") {

            if (maxPossible < range.min) {
                return false;
            }

        } else {

            if (minPossible > range.max) {
                return false;
            }

        }

    }


    return true;

}


/* =========================================================
   ПРОВЕРКА ФИНАЛЬНОГО СОСТОЯНИЯ
   ========================================================= */

function isValidFinalState(totals, stats) {

    for (const stat of stats) {

        const range = RANGES[stat];

        const value =
            totals[stat] || 0;


        /*
            Для обязательных характеристик
            проверяем диапазон.

            Для дополнительных:
            достаточно не выйти за максимум.
        */

        if (stat === "crit") {

            if (
                value < range.min ||
                value > range.max
            ) {
                return false;
            }

        }

        else if (stat === "penetration") {

            if (
                value < range.min ||
                value > range.max
            ) {
                return false;
            }

        }

        else if (stat === "accuracy") {

            if (
                value < range.min ||
                value > range.max
            ) {
                return false;
            }

        }

        else if (stat === "critDamage") {

            if (
                value < range.min ||
                value > range.max
            ) {
                return false;
            }

        }

        else if (stat === "attack") {

            if (value > range.max) {
                return false;
            }

        }

        else if (stat === "meter") {

            if (value > range.max) {
                return false;
            }

        }

        else if (stat === "cooldown") {

            if (value < range.min) {
                return false;
            }

        }

    }

    return true;

}


/* =========================================================
   ОЦЕНКА СОСТОЯНИЯ
   ========================================================= */

function scoreState(totals, stats) {

    let score = 0;

    /*
        Главная задача:

        1. Обязательные диапазоны.
        2. Не тратить лишнюю статы.
        3. Крит урон ближе к целевому.
        4. Остаток отправлять в атаку.
        5. Дополнительные характеристики используются позже.
    */


    /* -----------------------------------------
       КРИТ
       ----------------------------------------- */

    if (stats.includes("crit")) {

        const value = totals.crit || 0;

        const target = RANGES.crit.target;

        score -= Math.abs(value - target) * 100000;

    }


    /* -----------------------------------------
       ПРОНИЦАНИЕ
       ----------------------------------------- */

    if (stats.includes("penetration")) {

        const value = totals.penetration || 0;

        const target =
            RANGES.penetration.target;

        score -= Math.abs(value - target) * 100000;

    }


    /* -----------------------------------------
       ТОЧНОСТЬ
       ----------------------------------------- */

    if (stats.includes("accuracy")) {

        const value = totals.accuracy || 0;

        const target =
            RANGES.accuracy.target;

        score -= Math.abs(value - target) * 100000;

    }


    /* -----------------------------------------
       УРОН КРИТА
       ----------------------------------------- */

    if (stats.includes("critDamage")) {

        const value =
            totals.critDamage || 0;

        const target =
            RANGES.critDamage.target;

        score -= Math.abs(value - target) * 10000;

        /*
            После достижения диапазона
            не хочется бессмысленно завышать
            crit damage.
        */

        if (value >= RANGES.critDamage.min) {

            score -=
                Math.max(
                    0,
                    value - RANGES.critDamage.target
                ) * 100;

        }

    }


    /* -----------------------------------------
       АТАКА
       ----------------------------------------- */

    if (stats.includes("attack")) {

        const value =
            totals.attack || 0;

        /*
            Чем больше атаки после выполнения
            обязательных требований — тем лучше.
        */

        score += value * 50;

    }


    /* -----------------------------------------
       METER
       ----------------------------------------- */

    if (stats.includes("meter")) {

        const value =
            totals.meter || 0;

        score += value * 5;

    }


    /* -----------------------------------------
       COOLDOWN
       ----------------------------------------- */

    if (stats.includes("cooldown")) {

        const value =
            totals.cooldown || 0;

        /*
            Например -30 лучше, чем -10.
        */

        score += Math.abs(value) * 5;

    }


    return score;

}


/* =========================================================
   КЛЮЧ СОСТОЯНИЯ
   ========================================================= */

function makeKey(totals, stats) {

    return stats
        .map(stat => {

            return `${stat}:${totals[stat] || 0}`;

        })
        .join("|");

}


/* =========================================================
   УДАЛЕНИЕ ДУБЛИКАТОВ
   ========================================================= */

function compressStates(states, stats) {

    const map = new Map();

    for (const state of states) {

        const key =
            makeKey(state.totals, stats);

        const existing =
            map.get(key);

        if (!existing) {

            map.set(key, state);

            continue;

        }


        /*
            Если два пути приводят
            к одинаковым итоговым статам,
            оставляем путь с лучшим score.
        */

        if (
            scoreState(state.totals, stats) >
            scoreState(existing.totals, stats)
        ) {

            map.set(key, state);

        }

    }

    return [...map.values()];

}


/* =========================================================
   ДОМИНИРОВАНИЕ
   ========================================================= */

function removeDominated(states, stats) {

    /*
        Важно:

        Мы не сравниваем абсолютно все
        состояния между собой.

        Сначала группируем по обязательным
        характеристикам.

        Это сильно уменьшает количество
        состояний.
    */

    const groups = new Map();


    for (const state of states) {

        const key = stats
            .filter(stat =>
                stat === "crit" ||
                stat === "penetration" ||
                stat === "accuracy" ||
                stat === "critDamage"
            )
            .map(stat =>
                `${stat}:${state.totals[stat] || 0}`
            )
            .join("|");


        if (!groups.has(key)) {
            groups.set(key, []);
        }

        groups.get(key).push(state);

    }


    const result = [];


    for (const group of groups.values()) {

        /*
            Для одинаковых обязательных статов
            оставляем наиболее выгодное состояние.

            Это безопасно для нашей целевой функции,
            потому что вторичные характеристики
            используются как улучшение результата.
        */

        group.sort(
            (a, b) =>
                scoreState(b.totals, stats) -
                scoreState(a.totals, stats)
        );


        result.push(group[0]);

    }


    return result;

}


/* =========================================================
   СОЗДАНИЕ WORKER
   ========================================================= */

function createWorker() {

    const workerCode = `

    "use strict";


    const RANGES = ${JSON.stringify(RANGES)};


    function procValue(stat, proc) {

        const value = 3 * (proc + 1);

        if (stat === "cooldown") {
            return -value;
        }

        return value;

    }


    function generateAssignments(stats, procValues) {

        const result = [];


        for (let a = 0; a < stats.length; a++) {

            for (let b = 0; b < stats.length; b++) {

                if (a === b) continue;


                for (let c = 0; c < stats.length; c++) {

                    if (c === a || c === b) continue;


                    result.push([

                        {
                            stat: stats[a],
                            proc: procValues[0],
                            value: procValue(
                                stats[a],
                                procValues[0]
                            )
                        },

                        {
                            stat: stats[b],
                            proc: procValues[1],
                            value: procValue(
                                stats[b],
                                procValues[1]
                            )
                        },

                        {
                            stat: stats[c],
                            proc: procValues[2],
                            value: procValue(
                                stats[c],
                                procValues[2]
                            )
                        }

                    ]);

                }

            }

        }


        return result;

    }


    function addAssignment(totals, assignment) {

        const result = { ...totals };


        for (const item of assignment) {

            result[item.stat] =
                (result[item.stat] || 0) +
                item.value;

        }


        return result;

    }


    function makeKey(totals, stats) {

        return stats
            .map(stat =>
                stat + ":" + (totals[stat] || 0)
            )
            .join("|");

    }


    function stateStillPossible(
        totals,
        stats,
        slotsLeft
    ) {

        for (const stat of stats) {

            const range = RANGES[stat];

            const current =
                totals[stat] || 0;


            const maxPossible =
                current + slotsLeft * 45;

            const minPossible =
                current - slotsLeft * 45;


            if (stat !== "cooldown") {

                if (maxPossible < range.min) {
                    return false;
                }

            } else {

                if (minPossible > range.max) {
                    return false;
                }

            }

        }


        return true;

    }


    function isValidFinalState(
        totals,
        stats
    ) {

        for (const stat of stats) {

            const range =
                RANGES[stat];

            const value =
                totals[stat] || 0;


            if (
                stat === "crit" ||
                stat === "penetration" ||
                stat === "accuracy" ||
                stat === "critDamage"
            ) {

                if (
                    value < range.min ||
                    value > range.max
                ) {
                    return false;
                }

            }


            if (stat === "attack") {

                if (value > range.max) {
                    return false;
                }

            }


            if (stat === "meter") {

                if (value > range.max) {
                    return false;
                }

            }


            if (stat === "cooldown") {

                if (value < range.min) {
                    return false;
                }

            }

        }


        return true;

    }


    function scoreState(
        totals,
        stats
    ) {

        let score = 0;


        if (stats.includes("crit")) {

            score -=
                Math.abs(
                    (totals.crit || 0) -
                    RANGES.crit.target
                ) * 100000;

        }


        if (stats.includes("penetration")) {

            score -=
                Math.abs(
                    (totals.penetration || 0) -
                    RANGES.penetration.target
                ) * 100000;

        }


        if (stats.includes("accuracy")) {

            score -=
                Math.abs(
                    (totals.accuracy || 0) -
                    RANGES.accuracy.target
                ) * 100000;

        }


        if (stats.includes("critDamage")) {

            const value =
                totals.critDamage || 0;


            score -=
                Math.abs(
                    value -
                    RANGES.critDamage.target
                ) * 10000;


            if (
                value >=
                RANGES.critDamage.min
            ) {

                score -=
                    Math.max(
                        0,
                        value -
                        RANGES.critDamage.target
                    ) * 100;

            }

        }


        if (stats.includes("attack")) {

            score +=
                (totals.attack || 0) * 50;

        }


        if (stats.includes("meter")) {

            score +=
                (totals.meter || 0) * 5;

        }


        if (stats.includes("cooldown")) {

            score +=
                Math.abs(
                    totals.cooldown || 0
                ) * 5;

        }


        return score;

    }


    function compressStates(
        states,
        stats
    ) {

        const map = new Map();


        for (const state of states) {

            const key =
                makeKey(
                    state.totals,
                    stats
                );


            const existing =
                map.get(key);


            if (!existing) {

                map.set(key, state);

                continue;

            }


            if (
                scoreState(
                    state.totals,
                    stats
                ) >
                scoreState(
                    existing.totals,
                    stats
                )
            ) {

                map.set(key, state);

            }

        }


        return [...map.values()];

    }


    function removeDominated(
        states,
        stats
    ) {

        const groups = new Map();


        for (const state of states) {

            const key = stats
                .filter(stat =>
                    stat === "crit" ||
                    stat === "penetration" ||
                    stat === "accuracy" ||
                    stat === "critDamage"
                )
                .map(stat =>
                    stat +
                    ":" +
                    (state.totals[stat] || 0)
                )
                .join("|");


            if (!groups.has(key)) {
                groups.set(key, []);
            }


            groups
                .get(key)
                .push(state);

        }


        const result = [];


        for (const group of groups.values()) {

            let best = group[0];


            for (let i = 1; i < group.length; i++) {

                if (
                    scoreState(
                        group[i].totals,
                        stats
                    ) >
                    scoreState(
                        best.totals,
                        stats
                    )
                ) {

                    best = group[i];

                }

            }


            result.push(best);

        }


        return result;

    }


    self.onmessage = function(event) {

        try {

            const data =
                event.data;


            const stats =
                data.stats;


            const procs =
                data.procs;


            /*
                Генерируем 210 максимум
                вариантов для каждого слота.
            */

            const assignments =
                procs.map(
                    slot =>
                        generateAssignments(
                            stats,
                            slot
                        )
                );


            /*
                Начальное состояние.
            */

            let states = [

                {
                    totals: {},
                    slots: []
                }

            ];


            /*
                Последовательно обрабатываем
                5 слотов.

                Здесь НЕТ 210^5.
            */

            for (
                let slotIndex = 0;
                slotIndex < 5;
                slotIndex++
            ) {

                const next =
                    [];


                for (
                    const state of states
                ) {

                    for (
                        const assignment
                        of assignments[slotIndex]
                    ) {

                        const totals =
                            addAssignment(
                                state.totals,
                                assignment
                            );


                        const slots =
                            state.slots.concat([
                                assignment
                            ]);


                        const slotsLeft =
                            4 - slotIndex;


                        if (
                            !stateStillPossible(
                                totals,
                                stats,
                                slotsLeft
                            )
                        ) {

                            continue;

                        }


                        next.push({

                            totals,
                            slots

                        });

                    }

                }


                /*
                    Удаляем одинаковые состояния.
                */

                states =
                    compressStates(
                        next,
                        stats
                    );


                /*
                    Удаляем заведомо худшие
                    состояния.
                */

                states =
                    removeDominated(
                        states,
                        stats
                    );


                self.postMessage({

                    type: "progress",

                    slot:
                        slotIndex + 1,

                    states:
                        states.length

                });

            }


            /*
                Ищем финальные допустимые состояния.
            */

            let best = null;

            let bestScore = -Infinity;


            for (
                const state of states
            ) {

                if (
                    !isValidFinalState(
                        state.totals,
                        stats
                    )
                ) {

                    continue;

                }


                const score =
                    scoreState(
                        state.totals,
                        stats
                    );


                if (
                    score > bestScore
                ) {

                    bestScore =
                        score;

                    best =
                        state;

                }

            }


            self.postMessage({

                type: "done",

                result: best

            });


        } catch (error) {

            self.postMessage({

                type: "error",

                error:
                    error &&
                    error.message
                    ?
                    error.message
                    :
                    String(error)

            });

        }

    };

    `;


    const blob =
        new Blob(
            [workerCode],
            {
                type: "application/javascript"
            }
        );


    return new Worker(
        URL.createObjectURL(blob)
    );

}


/* =========================================================
   ЗАПУСК РАСЧЁТА
   ========================================================= */

function startCalculation() {

    validationError.textContent = "";

    result.style.display = "none";

    progress.textContent = "";


    const validation =
        validate();


    if (!validation.valid) {

        validationError.textContent =
            validation.error;

        return;

    }


    const stats =
        getEnabledStats();


    const procs =
        getProcs();


    calculateButton.disabled = true;

    calculateButton.textContent =
        "Идёт расчёт...";


    const worker =
        createWorker();


    worker.onmessage =
        function(event) {

            const data =
                event.data;


            if (
                data.type ===
                "progress"
            ) {

                progress.textContent =
                    `Обработан слот ${data.slot}/5. ` +
                    `Состояний: ${data.states.toLocaleString("ru-RU")}`;

                return;

            }


            if (
                data.type ===
                "error"
            ) {

                progress.textContent =
                    "Ошибка расчёта: " +
                    data.error;


                calculateButton.disabled =
                    false;


                calculateButton.textContent =
                    "Рассчитать оптимальную комбинацию";


                worker.terminate();

                return;

            }


            if (
                data.type ===
                "done"
            ) {

                calculateButton.disabled =
                    false;


                calculateButton.textContent =
                    "Рассчитать оптимальную комбинацию";


                worker.terminate();


                if (!data.result) {

                    progress.textContent =
                        "Подходящей комбинации не найдено.";

                    return;

                }


                progress.textContent =
                    "Расчёт завершён.";


                showResult(
                    data.result,
                    stats,
                    procs
                );

            }

        };


    worker.onerror =
        function(error) {

            progress.textContent =
                "Ошибка расчёта.";


            calculateButton.disabled =
                false;


            calculateButton.textContent =
                "Рассчитать оптимальную комбинацию";


            worker.terminate();

            console.error(error);

        };


    worker.postMessage({

        stats,
        procs

    });

}


/* =========================================================
   ПОКАЗ РЕЗУЛЬТАТА
   ========================================================= */

function showResult(
    solution,
    stats,
    procs
) {

    result.style.display =
        "block";


    let html = "";


    html += "<h3>Распределение характеристик</h3>";


    for (
        let slotIndex = 0;
        slotIndex < solution.slots.length;
        slotIndex++
    ) {

        const slot =
            solution.slots[slotIndex];


        html += `
            <div class="result-slot">
                <h3>Слот ${slotIndex + 1}</h3>
        `;


        for (
            let cellIndex = 0;
            cellIndex < slot.length;
            cellIndex++
        ) {

            const item =
                slot[cellIndex];


            html += `
                <div class="result-stat">
                    <span>
                        Ячейка ${cellIndex + 1}:
                        <strong>
                            ${STAT_NAMES[item.stat]}
                        </strong>
                    </span>

                    <span>
                        ${item.proc} проков
                        (${formatPercent(item.value)})
                    </span>
                </div>
            `;

        }


        html += "</div>";

    }


    html += "<h3>Итоговые характеристики</h3>";


    const totals =
        solution.totals;


    /*
        Выводим только выбранные характеристики.
    */

    for (const stat of stats) {

        let value =
            totals[stat] || 0;


        /*
            К базовому криту добавляем
            20% персонажа.
        */

        if (stat === "crit") {

            value += BASE_CRIT;

        }


        html += `
            <div class="result-stat total-row">
                <span>
                    ${STAT_NAMES[stat]}
                </span>

                <span>
                    ${formatPercent(value)}
                </span>
            </div>
        `;

    }


    html += calculateUnused(
        totals,
        stats,
        procs
    );


    resultContent.innerHTML =
        html;

}


/* =========================================================
   РАСЧЁТ НЕИСПОЛЬЗОВАННОЙ СТАТЫ
   ========================================================= */

function calculateUnused(
    totals,
    stats,
    procs
) {

    /*
        Всего проковых единиц:

        5 слотов * 14 = 70.
    */

    const totalProcPool =
        5 * 14;


    /*
        Каждая ячейка использует
        один проковый показатель.

        Здесь считаем именно
        "свободные места по значениям проков".

        Поскольку характеристики получают
        фиксированные проки, итоговое число
        всегда определяется назначением.
    */

    let usedProc =
        0;


    for (const slot of procs) {

        usedProc +=
            slot[0] +
            slot[1] +
            slot[2];

    }


    /*
        Все 70 проков фактически распределены.

        Поэтому свободная стата — это не
        "неиспользованные проковые ячейки",
        а запас относительно полезных диапазонов.

        Считаем запас для обязательных статов.
    */

    let useful = 0;


    for (const stat of stats) {

        const range =
            RANGES[stat];


        let value =
            totals[stat] || 0;


        if (stat === "crit") {

            value += BASE_CRIT;

        }


        if (
            stat === "crit" ||
            stat === "penetration" ||
            stat === "accuracy" ||
            stat === "critDamage"
        ) {

            if (value > range.max) {

                useful +=
                    range.max;

            } else {

                useful +=
                    value;

            }

        }

        else if (stat === "attack") {

            useful +=
                Math.min(
                    value,
                    range.max
                );

        }

        else if (stat === "meter") {

            useful +=
                Math.min(
                    value,
                    range.max
                );

        }

        else if (stat === "cooldown") {

            useful +=
                Math.min(
                    Math.abs(value),
                    Math.abs(range.min)
                );

        }

    }


    return `
        <div class="unused">

            <strong>Использование статы</strong>

            <div class="result-stat">
                <span>Проковый пул</span>
                <span>${totalProcPool}</span>
            </div>

            <div class="result-stat">
                <span>Распределено проков</span>
                <span>${usedProc}</span>
            </div>

            <div class="result-stat">
                <span>Ячеек</span>
                <span>15 / 15</span>
            </div>

            <p>
                Все 15 ячеек заполнены.
                Дополнительная свободная стата
                определяется тем, насколько близко
                обязательные характеристики находятся
                к своим целевым значениям.
            </p>

        </div>
    `;

}


/* =========================================================
   ФОРМАТ ПРОЦЕНТОВ
   ========================================================= */

function formatPercent(value) {

    if (value > 0) {

        return `+${value}%`;

    }

    return `${value}%`;

}


/* =========================================================
   ОБНОВЛЕНИЕ БЛОКА ИСПОЛЬЗОВАНИЯ СТАТЫ
   ========================================================= */

function updateUsage() {

    const stats =
        getEnabledStats();


    const procs =
        getProcs();


    let total =
        0;


    for (const slot of procs) {

        total +=
            slot[0] +
            slot[1] +
            slot[2];

    }


    usage.innerHTML = `

        <div class="result-stat">

            <span>
                Общий проковый пул
            </span>

            <span>
                70
            </span>

        </div>

        <div class="result-stat">

            <span>
                Введено проков
            </span>

            <span>
                ${total}
            </span>

        </div>

        <div class="result-stat">

            <span>
                Выбрано характеристик
            </span>

            <span>
                ${stats.length}
            </span>

        </div>

    `;

}


/* =========================================================
   СОБЫТИЯ
   ========================================================= */

procCells.forEach(
    cell => {

        cell.addEventListener(
            "input",
            function() {

                updateProcSums();

                updateUsage();

            }
        );

    }
);


statChecks.forEach(
    check => {

        check.addEventListener(
            "change",
            function() {

                updateUsage();

            }
        );

    }
);


calculateButton.addEventListener(
    "click",
    startCalculation
);


/* =========================================================
   СТАРТОВОЕ СОСТОЯНИЕ
   ========================================================= */

updateProcSums();

updateUsage();

</script>
